name: Discover recruiter SAP opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"

permissions:
  contents: write

concurrency:
  group: recruiter-opportunity-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_DISCOVERY_MODEL: ${{ vars.OPENAI_DISCOVERY_MODEL || 'gpt-5.6-terra' }}

    steps:
      - name: Check out Talent Radar
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover and validate recruiter-post opportunities
        run: node scripts/discover-recruiter-posts.mjs

      - name: Test generated data
        run: |
          node --test tests/recruiter-discovery.test.mjs
          node scripts/discover-recruiter-posts.mjs --validate-only

      - name: Publish changed opportunity data
        shell: bash
        run: |
          if git diff --quiet -- data/recruiter-post-jobs.json scripts/recruiter-post-jobs.js; then
            echo "No recruiter opportunity changes to publish."
            exit 0
          fi
          git config user.name "talent-radar-discovery[bot]"
          git config user.email "talent-radar-discovery[bot]@users.noreply.github.com"
          git add data/recruiter-post-jobs.json scripts/recruiter-post-jobs.js
          git commit -m "data: refresh recruiter-post opportunities"
          git push
